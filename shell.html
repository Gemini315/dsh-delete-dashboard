<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness Desktop</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI Variable", "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #f6f7f9;
        color: #172033;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        user-select: none;
      }

      body {
        background:
          radial-gradient(circle at 26% 32%, rgba(80, 124, 255, 0.12), transparent 34%),
          radial-gradient(circle at 76% 72%, rgba(33, 192, 164, 0.1), transparent 28%),
          #f6f7f9;
      }

      .titlebar {
        position: relative;
        z-index: 10;
        height: 42px;
        display: flex;
        align-items: stretch;
        border-bottom: 1px solid #e4e7ec;
        background: rgba(251, 252, 253, 0.96);
        box-shadow: 0 1px 0 rgba(20, 31, 50, 0.02);
        -webkit-app-region: drag;
      }

      .identity {
        min-width: 0;
        padding: 0 14px;
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .app-mark {
        width: 22px;
        height: 22px;
        flex: none;
      }

      .app-mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .title {
        max-width: min(520px, 45vw);
        overflow: hidden;
        color: #253047;
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .edition {
        padding: 3px 5px 2px;
        border: 1px solid #d9dee7;
        border-radius: 4px;
        color: #7a8497;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1;
      }

      .drag-space { flex: 1; }

      .window-controls {
        height: 42px;
        display: flex;
        -webkit-app-region: no-drag;
      }

      .window-button {
        width: 46px;
        height: 42px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 0;
        outline: 0;
        background: transparent;
        color: #354054;
      }

      .window-button:hover { background: #e9ecf1; }
      .window-button:active { background: #dfe3e9; }
      .window-button:focus-visible { box-shadow: inset 0 0 0 2px #7092f4; }

      .window-button.close:hover {
        background: #e81123;
        color: white;
      }

      .window-button.close:active { background: #c50f1f; }

      .window-button svg {
        width: 11px;
        height: 11px;
        overflow: visible;
        fill: none;
        stroke: currentColor;
        stroke-linecap: square;
        stroke-width: 1.2;
      }

      .restore-icon { display: none; }
      body.maximized .maximize-icon { display: none; }
      body.maximized .restore-icon { display: block; }

      .loading-stage {
        height: calc(100% - 42px);
        display: grid;
        place-items: center;
      }

      .loading-card {
        width: min(440px, calc(100vw - 64px));
        padding: 34px 38px;
        border: 1px solid rgba(40, 55, 80, 0.1);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 70px rgba(42, 58, 87, 0.11);
        backdrop-filter: blur(16px);
      }

      .loading-card h1 {
        margin: 0 0 9px;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .loading-card p {
        margin: 0;
        color: #7a8495;
        font-size: 13px;
        line-height: 1.65;
      }

      .progress {
        height: 3px;
        margin-top: 24px;
        overflow: hidden;
        border-radius: 999px;
        background: #e9edf3;
      }

      .progress::after {
        content: "";
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #557df1, #2ac0aa);
        animation: travel 1.3s ease-in-out infinite;
      }

      @keyframes travel {
        from { transform: translateX(-110%); }
        to { transform: translateX(370%); }
      }
    </style>
  </head>
  <body>
    <header class="titlebar" id="titlebar">
      <div class="identity">
        <div class="app-mark" aria-hidden="true">
          <img src="build/deepseek-harness.svg" alt="" />
        </div>
        <div class="title" id="page-title">DeepSeek Harness</div>
        <span class="edition">DESKTOP</span>
      </div>
      <div class="drag-space"></div>
      <div class="window-controls" aria-label="窗口控制">
        <button class="window-button" id="minimize" type="button" title="最小化" aria-label="最小化">
          <svg viewBox="0 0 12 12"><path d="M1.5 6.5h9" /></svg>
        </button>
        <button class="window-button" id="maximize" type="button" title="最大化" aria-label="最大化">
          <svg class="maximize-icon" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" /></svg>
          <svg class="restore-icon" viewBox="0 0 12 12"><path d="M3.5 3.5V1.5h7v7h-2M1.5 3.5h7v7h-7z" /></svg>
        </button>
        <button class="window-button close" id="close" type="button" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 12 12"><path d="m2 2 8 8M10 2 2 10" /></svg>
        </button>
      </div>
    </header>

    <main class="loading-stage">
      <section class="loading-card">
        <h1>正在启动 DeepSeek Harness</h1>
        <p>正在准备本地 Agent 服务与工作区环境，请稍候。</p>
        <div class="progress" aria-label="正在启动"></div>
      </section>
    </main>

    <button class="dashboard-tab" id="dashboard-tab" type="button" title="仪表盘" aria-label="仪表盘">📊</button>
    <aside id="dashboard" class="dashboard closed" aria-hidden="true">
      <div class="dashboard-head">
        <h3 class="dashboard-title">会话仪表盘</h3>
        <button type="button" id="d-close" class="dashboard-close" title="关闭仪表盘" aria-label="关闭仪表盘">✕</button>
      </div>
      <section class="dashboard-body">
        <h3 class="dashboard-title">会话仪表盘</h3>
        <div class="metric"><span class="metric-label">余额 (CNY)</span><b id="d-balance">—</b></div>
        <div class="metric"><span class="metric-label">累计 tokens</span><b id="d-tokens">—</b></div>
        <div class="metric"><span class="metric-label">会话费用 (USD)</span><b id="d-cost">—</b></div>
        <div class="metric"><span class="metric-label">请求数</span><b id="d-requests">—</b></div>
        <div class="metric"><span class="metric-label">运行时间</span><b id="d-time">—</b></div>
        <div class="dashboard-actions">
          <button type="button" id="d-refresh" class="dashboard-button">刷新数据</button>
        </div>
        <p class="dashboard-note">余额来自 DeepSeek 账户；费用按 token 用量估算。</p>
      </section>
    </aside>

    <style>
      :root {
        --dash-bg: #1e2330;
        --dash-border: #2c3242;
        --dash-title: #e8eaf0;
        --dash-label: #9aa1ad;
        --dash-value: #e8eaf0;
        --dash-row: #262c3a;
        --dash-btn-bg: #2c3242;
        --dash-btn-border: #3a4256;
        --dash-btn-hover: #343c50;
        --dash-shadow: rgba(0, 0, 0, 0.4);
      }
      body { background: var(--dash-bg); }
      .dashboard {
        position: fixed;
        top: 42px;
        right: 0;
        bottom: 0;
        width: 288px;
        background: var(--dash-bg);
        border-left: 1px solid var(--dash-border);
        box-shadow: -8px 0 24px var(--dash-shadow);
        transform: translateX(100%);
        transition: transform 0.22s ease;
        z-index: 40;
        display: flex;
        flex-direction: column;
      }
      .dashboard.open { transform: translateX(0); }
      .dashboard-tab {
        position: fixed;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 34px;
        height: 84px;
        border: 1px solid var(--dash-border);
        border-right: none;
        border-radius: 10px 0 0 10px;
        background: var(--dash-bg);
        color: var(--dash-title);
        font-size: 16px;
        cursor: pointer;
        z-index: 41;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: right 0.22s ease;
      }
      .dashboard-tab:hover { background: var(--dash-btn-hover); }
      .dashboard-tab.on-panel {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        font-size: 15px;
        transform: none;
        transition: none;
      }
      .dashboard-body { padding: 16px; overflow-y: auto; }
      .dashboard-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 12px 0 16px;
      }
      .dashboard-head .dashboard-title { margin: 0; }
      .dashboard-close {
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--dash-label);
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dashboard-close:hover { background: var(--dash-btn-hover); color: var(--dash-title); }
      .dashboard-title { margin: 0 0 14px; font-size: 15px; color: var(--dash-title); }
      .metric {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 9px 0;
        border-bottom: 1px solid var(--dash-row);
      }
      .metric-label { font-size: 13px; color: var(--dash-label); }
      .metric b { font-size: 15px; color: var(--dash-value); font-variant-numeric: tabular-nums; }
      .dashboard-actions { margin-top: 16px; }
      .dashboard-button {
        width: 100%;
        padding: 8px 0;
        border: 1px solid var(--dash-btn-border);
        border-radius: 6px;
        background: var(--dash-btn-bg);
        color: var(--dash-title);
        cursor: pointer;
        font-size: 13px;
      }
      .dashboard-button:hover { background: var(--dash-btn-hover); }
      .dashboard-note { margin-top: 12px; font-size: 11px; color: var(--dash-label); line-height: 1.5; }
    </style>

    <script>
      const titlebar = document.getElementById('titlebar')
      const title = document.getElementById('page-title')
      const maximizeButton = document.getElementById('maximize')

      function renderWindowState(state) {
        const maximized = Boolean(state?.maximized)
        document.body.classList.toggle('maximized', maximized)
        maximizeButton.title = maximized ? '还原' : '最大化'
        maximizeButton.setAttribute('aria-label', maximized ? '还原' : '最大化')
      }

      document.getElementById('minimize').addEventListener('click', () => {
        window.desktopWindow.minimize()
      })

      maximizeButton.addEventListener('click', () => {
        window.desktopWindow.toggleMaximize()
      })

      document.getElementById('close').addEventListener('click', () => {
        window.desktopWindow.close()
      })

      titlebar.addEventListener('dblclick', event => {
        if (event.target.closest('.window-controls')) return
        window.desktopWindow.toggleMaximize()
      })

      window.desktopWindow.getState().then(renderWindowState)
      window.desktopWindow.onStateChange(renderWindowState)
      window.desktopWindow.onPageTitle(nextTitle => {
        title.textContent = nextTitle || 'DeepSeek Harness'
      })

      // ---- Dashboard side panel ----
      const dashboard = document.getElementById('dashboard')
      const toggle = document.getElementById('dashboard-tab')
      const positionTab = (open) => {
        toggle.classList.toggle('on-panel', open)
        if (open) {
          toggle.style.right = '10px'
          toggle.style.top = '52px'
        } else {
          toggle.style.right = '0'
          toggle.style.top = ''
        }
      }
      const fmt = (n) => Number(n).toLocaleString('zh-CN', { maximumFractionDigits: 2 })
      const setMetric = (id, text) => {
        const el = document.getElementById(id)
        if (el) el.textContent = text
      }

      async function refreshDashboard() {
        try {
          const data = await window.desktopWindow.getDashboardData()
          if (data.theme) {
            const root = document.documentElement
            const set = (n, v) => { if (v) root.style.setProperty(n, v) }
            set('--dash-bg', data.theme.panel)
            set('--dash-border', data.theme.border)
            set('--dash-title', data.theme.text)
            set('--dash-value', data.theme.text)
            set('--dash-label', data.theme.label)
            set('--dash-row', data.theme.border)
            set('--dash-btn-bg', data.theme.panel)
            set('--dash-btn-border', data.theme.border)
          }
          setMetric('d-balance', data.balance !== null ? fmt(data.balance) : 'N/A')
          setMetric('d-tokens', fmt(data.tokens))
          setMetric('d-cost', data.cost !== null ? fmt(data.cost) : 'N/A')
          setMetric('d-requests', fmt(data.requests))
          setMetric('d-time', data.runtimeText || '—')
        } catch (error) {
          setMetric('d-balance', '错误')
        }
      }

      document.getElementById('d-close').addEventListener('click', async () => {
        const open = await window.desktopWindow.toggleDashboard()
        dashboard.classList.toggle('open', open)
        dashboard.classList.toggle('closed', !open)
        dashboard.setAttribute('aria-hidden', String(!open))
        positionTab(open)
      })

      toggle.addEventListener('click', async () => {
        const open = await window.desktopWindow.toggleDashboard()
        dashboard.classList.toggle('open', open)
        dashboard.classList.toggle('closed', !open)
        dashboard.setAttribute('aria-hidden', String(!open))
        toggle.title = open ? '收起仪表盘' : '展开仪表盘'
        positionTab(open)
        if (open) refreshDashboard()
      })

      window.desktopWindow.getDashboardState().then(open => {
        dashboard.classList.toggle('open', open)
        dashboard.classList.toggle('closed', !open)
        dashboard.setAttribute('aria-hidden', String(!open))
        positionTab(open)
        toggle.title = open ? '收起仪表盘' : '展开仪表盘'
      })

      document.getElementById('d-refresh').addEventListener('click', refreshDashboard)

      // 会话切换时由主进程推送刷新事件：仅切换就立即重算当前会话统计（无需发消息）。
      window.desktopWindow.onDashboardRefresh(() => {
        if (dashboard.classList.contains('open')) refreshDashboard()
      })

      // 自动刷新：仪表盘展开时每 60 秒刷新一次数据。
      setInterval(() => {
        if (dashboard.classList.contains('open')) refreshDashboard()
      }, 15000)
    </script>
  </body>
</html>
